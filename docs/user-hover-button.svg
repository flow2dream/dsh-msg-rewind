<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2430"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="12" fill="url(#bg2)"/>

  <text x="28" y="36" fill="#e8ecf4" font-size="15" font-weight="600">对话 · 悬浮 USER 消息</text>
  <line x1="28" y1="50" x2="692" y2="50" stroke="#2c3446" stroke-width="1"/>

  <!-- 用户消息气泡（悬浮态：显示时间 + 复制 + 撤回） -->
  <g>
    <!-- 时间 -->
    <text x="470" y="92" fill="#6b7a93" font-size="12" text-anchor="end">19:20</text>

    <!-- 气泡 -->
    <rect x="430" y="104" width="240" height="44" rx="16" fill="#3b4a63"/>
    <text x="450" y="122" fill="#e8ecf4" font-size="13">你撤回的那条消息内容</text>
    <text x="450" y="140" fill="#8fa3c8" font-size="12">悬浮时显示操作按钮…</text>

    <!-- 操作栏：复制 + 撤回（撤回高亮示意） -->
    <g transform="translate(560, 162)">
      <!-- 复制按钮 -->
      <rect x="0" y="0" width="28" height="28" rx="14" fill="transparent"/>
      <g transform="translate(6,6)" fill="none" stroke="#6b7a93" stroke-width="1.5">
        <rect x="0" y="0" width="10" height="10" rx="1.5"/>
        <path d="M6 0V.5A2 2 0 0 0 4 2.5H2"/>
      </g>
      <text x="6" y="42" fill="#4a5568" font-size="10" text-anchor="middle">复制</text>

      <!-- 撤回按钮（高亮） -->
      <rect x="36" y="0" width="28" height="28" rx="14" fill="#2f6fed"/>
      <g transform="translate(42,6)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 0 1 5 6 10"/>
        <path d="M2 5h6a3 3 0 0 1 3 3v5"/>
      </g>
      <text x="50" y="42" fill="#8fa3c8" font-size="10" text-anchor="middle">撤回</text>
    </g>
  </g>

  <!-- 说明 -->
  <g font-size="12" fill="#5a6a80">
    <text x="28" y="230">鼠标悬浮到任意用户消息气泡，操作栏浮现：</text>
    <text x="28" y="250">· 复制按钮 — 复制消息文本</text>
    <text x="28" y="270">· 撤回按钮（撤销箭头图标）— 回退到该条消息之前</text>
    <text x="28" y="290">点击撤回 = 执行 /rewind &lt;seq&gt;，删除该条及之后所有内容并刷新界面</text>
  </g>

  <!-- 撤回前 / 撤回后对比 -->
  <g>
    <rect x="28" y="320" width="320" height="72" rx="8" fill="#131926" stroke="#2c3446"/>
    <text x="42" y="344" fill="#c6d0e0" font-size="12" font-weight="600">撤回前</text>
    <text x="42" y="366" fill="#6b7a93" font-size="11">消息A → 回复A → 消息B → 回复B</text>

    <rect x="372" y="320" width="320" height="72" rx="8" fill="#131926" stroke="#2f6fed"/>
    <text x="386" y="344" fill="#c6d0e0" font-size="12" font-weight="600">撤回后（回到消息A之前）</text>
    <text x="386" y="366" fill="#6b7a93" font-size="11">消息A</text>
  </g>
</svg>
